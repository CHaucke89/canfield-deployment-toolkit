name: Release DeployToolkit EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare PowerShell module sources
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name ps2exe -Scope CurrentUser -TrustRepository

      - name: Build EXE with PS2EXE
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # Stamp the exe with the tag's version (v1.2.0 -> 1.2.0.0); manual runs off a branch keep the default.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./Build-Toolkit-Exe.ps1 -Version $env:GITHUB_REF_NAME
          } else {
            ./Build-Toolkit-Exe.ps1
          }

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Sign CDT.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: haucke-labs
          certificate-profile-name: Personal
          files-folder: build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - run: Copy-Item build/CDT.exe build/CDT-${{ github.ref_name }}.exe

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: build/CDT-${{ github.ref_name }}.exe
          generate_release_notes: true
