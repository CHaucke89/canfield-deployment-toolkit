name: Build DeployToolkit EXE

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare PowerShell module sources
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name ps2exe -Scope CurrentUser -TrustRepository

      - name: Build EXE with PS2EXE
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./Build-Toolkit-Exe.ps1

      - name: Log in to Azure
        if: github.ref == 'refs/heads/master'
        uses: azure/login@v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Sign CDT.exe
        if: github.ref == 'refs/heads/master'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: haucke-labs
          certificate-profile-name: Personal
          files-folder: build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload CDT.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDT-exe
          path: build/CDT.exe
          if-no-files-found: error
